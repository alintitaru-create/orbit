<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="robots" content="noindex,nofollow">
<title>Orbit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">

<!-- ═══ STILI (settori: token → base → componenti → scaffale) ═══ -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/scaffale.css">
</head>
<body>

<!-- ═══════════ SCHERMATA DI SBLOCCO (solo nella versione online) ═══════════ -->
<div id="gate" hidden>
  <form id="gateForm">
    <img src="icon.png" alt="" width="72" height="72">
    <h1>Orbit</h1>
    <p>I viaggi di Alin e Benedetta.<br>Sono cifrati: serve la password.</p>
    <input type="text" name="username" value="orbit" autocomplete="username" hidden>
    <input type="password" id="gatePw" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
    <button class="pill on" type="submit">Apri</button>
    <small id="gateErr"></small>
  </form>
</div>

<!-- ═══════════ TESTATA ═══════════ -->
<header class="hero scaffale-hero">
  <h1>Orbit<small id="totali"></small></h1>
</header>

<main>

<!-- ═══════════ I VIAGGI ═══════════ -->
<section id="viaggi">
  <div id="scaffale"></div>
</section>

<!-- ═══════════ LA LAVAGNA DELLE IDEE ═══════════ -->
<section id="idee">
  <h2>Idee</h2>
  <p class="sub">I posti che ci girano in testa. Qui non servono le date: bastano il nome e la voglia.</p>
  <div id="lavagna"></div>
</section>

</main>

<footer>
  <p>Orbit · i dati restano cifrati, la password non esce da questo dispositivo.</p>
</footer>

<!-- ═══════════ SETTORI ═══════════ -->
<script src="js/chiave.js"></script>
<script src="js/viaggi.js"></script>
<script src="js/migra.js"></script>
<script src="js/pubblica.js"></script>
<script src="js/scaffale.js"></script>
<script src="js/idee.js"></script>
<script src="js/boot-scaffale.js"></script>
</body>
</html>
